name: Build VideoHub APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Extract and Build APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # 2. Setup Java
      # AGP 9.x requires modern Java
      # ---------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ---------------------------------------------
      # 3. Setup Android SDK
      # ---------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------
      # 4. Install required Android SDK packages
      # ---------------------------------------------
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # ---------------------------------------------
      # 5. Find VideoHub ZIP
      # ---------------------------------------------
      - name: Locate project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f \
            \( -name '*.zip' -o -name 'videohub.zip' \) \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP file was found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Found project:"
          echo "$ZIP_FILE"

      # ---------------------------------------------
      # 6. Extract ZIP
      # ---------------------------------------------
      - name: Extract VideoHub project
        shell: bash
        run: |
          set -e

          rm -rf .build
          mkdir -p .build/project

          unzip -q "$ZIP_FILE" -d .build/project

          echo "Extracted files:"
          find .build/project -maxdepth 3 -type f | sort | head -100

      # ---------------------------------------------
      # 7. Detect actual Gradle project directory
      # ---------------------------------------------
      - name: Detect Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find .build/project \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort

      # ---------------------------------------------
      # 8. Create development debug keystore
      # ---------------------------------------------
      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f debug.keystore ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          ls -lh debug.keystore

      # ---------------------------------------------
      # 9. Create Gradle user properties
      # ---------------------------------------------
      - name: Configure Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # ---------------------------------------------
      # 10. Download Gradle
      # ---------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # ---------------------------------------------
      # 11. Check Gradle project
      # ---------------------------------------------
      - name: Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version

      # ---------------------------------------------
      # 12. Run unit tests
      # ---------------------------------------------
      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle test --stacktrace

      # ---------------------------------------------
      # 13. Build Debug APK
      # ---------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace --info

      # ---------------------------------------------
      # 14. Find generated APK
      # ---------------------------------------------
      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "${PROJECT_DIR}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_FILE=$APK" >> "$GITHUB_ENV"

          echo "APK:"
          echo "$APK"

      # ---------------------------------------------
      # 15. Rename APK
      # ---------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "$APK_FILE" \
            "release/VideoHub-debug.apk"

          ls -lh release/VideoHub-debug.apk

      # ---------------------------------------------
      # 16. Upload APK to GitHub Actions
      # ---------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoHub-APK
          path: release/VideoHub-debug.apk
          if-no-files-found: error
          retention-days: 30

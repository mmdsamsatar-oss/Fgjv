name: Build VideoHub APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Configure Android SDK
      # ==========================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f \
              -print \
              -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$SDKMANAGER"


      # ==========================================
      # 4. Accept licenses
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -eux

          yes | "$SDKMANAGER" --licenses > /dev/null || true


      # ==========================================
      # 5. Install required SDK packages
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # ==========================================
      # 6. Find ZIP
      # ==========================================
      - name: Find VideoHub ZIP
        shell: bash
        run: |
          set -eux

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print \
            -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: VideoHub ZIP was not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$ZIP_FILE"


      # ==========================================
      # 7. Extract ZIP
      # ==========================================
      - name: Extract VideoHub
        shell: bash
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/.build"

          mkdir -p "$GITHUB_WORKSPACE/.build/project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/.build/project"

          echo ""
          echo "Extracted project:"
          find "$GITHUB_WORKSPACE/.build/project" \
            -maxdepth 3 \
            -type f \
            | sort


      # ==========================================
      # 8. Detect Gradle project
      # ==========================================
      - name: Detect Gradle project
        shell: bash
        run: |
          set -eux

          SETTINGS_FILE="$(find \
            "$GITHUB_WORKSPACE/.build/project" \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Gradle project:"
          echo "$PROJECT_DIR"


      # ==========================================
      # 9. Install Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'


      # ==========================================
      # 10. Configure Gradle
      # ==========================================
      - name: Configure Gradle
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # ==========================================
      # 11. Create debug keystore
      # ==========================================
      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -eux

          if [ ! -f debug.keystore ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi


      # ==========================================
      # 12. Show environment
      # ==========================================
      - name: Check build environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          "$SDKMANAGER" --list_installed || true


      # ==========================================
      # 13. Run tests
      # ==========================================
      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle test \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 14. Build APK
      # ==========================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ==========================================
      # 15. Find APK
      # ==========================================
      - name: Find generated APK
        shell: bash
        run: |
          set -eux

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(find \
            "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print \
            -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          echo "APK:"
          echo "$APK_FILE"


      # ==========================================
      # 16. Prepare APK
      # ==========================================
      - name: Prepare APK
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/VideoHub-debug.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/release/VideoHub-debug.apk"


      # ==========================================
      # 17. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoHub-APK
          path: release/VideoHub-debug.apk
          if-no-files-found: error
          retention-days: 30

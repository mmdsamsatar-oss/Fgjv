name: Build VideoHub APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Extract and Build APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout GitHub Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Install Java
      # ==========================================
      # مهم:
      # اینجا Gradle cache را فعال نمی‌کنیم،
      # چون پروژه فعلاً داخل ZIP است.
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 4. Install Android SDK
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"


      # ==========================================
      # 5. Find ZIP
      # ==========================================
      - name: Find VideoHub ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -name "*.zip" \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Found ZIP:"
          echo "$ZIP_FILE"


      # ==========================================
      # 6. Extract ZIP
      # ==========================================
      - name: Extract VideoHub project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/.build"

          mkdir -p "$GITHUB_WORKSPACE/.build/project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/.build/project"

          echo "Extracted project:"
          find "$GITHUB_WORKSPACE/.build/project" \
            -maxdepth 3 \
            -type f \
            | sort


      # ==========================================
      # 7. Find Gradle Project
      # ==========================================
      - name: Detect Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/.build/project" \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project detected:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project structure:"
          find "$PROJECT_DIR" \
            -maxdepth 2 \
            -type f \
            | sort


      # ==========================================
      # 8. Setup Gradle
      # ==========================================
      # Gradle version موجود در پروژه:
      # 9.3.1
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'


      # ==========================================
      # 9. Create Debug Keystore
      # ==========================================
      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f debug.keystore ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          echo "Debug keystore ready."


      # ==========================================
      # 10. Configure Gradle
      # ==========================================
      - name: Configure Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'

          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

          org.gradle.daemon=false

          org.gradle.parallel=true

          org.gradle.caching=true

          android.useAndroidX=true

          android.nonTransitiveRClass=true

          EOF


      # ==========================================
      # 11. Check Gradle
      # ==========================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version


      # ==========================================
      # 12. Run Unit Tests
      # ==========================================
      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle test \
            --stacktrace \
            --no-daemon


      # ==========================================
      # 13. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --stacktrace \
            --no-daemon


      # ==========================================
      # 14. Find APK
      # ==========================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          echo "$APK_FILE"


      # ==========================================
      # 15. Prepare APK
      # ==========================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/VideoHub-debug.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/release/VideoHub-debug.apk"


      # ==========================================
      # 16. Upload APK Artifact
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoHub-APK
          path: release/VideoHub-debug.apk
          if-no-files-found: error
          retention-days: 30

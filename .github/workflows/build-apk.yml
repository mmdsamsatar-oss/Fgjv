name: Build VideoHub APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Java 17
      # ----------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ----------------------------------------
      # 3. Android SDK
      # ----------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ----------------------------------------
      # 4. Accept Android SDK licenses
      # ----------------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true


      # ----------------------------------------
      # 5. Install required Android SDK
      # ----------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses > /dev/null || true


      # ----------------------------------------
      # 6. Find ZIP
      # ----------------------------------------
      - name: Find VideoHub ZIP
        shell: bash
        run: |
          set -eux

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print \
            -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ----------------------------------------
      # 7. Extract ZIP
      # ----------------------------------------
      - name: Extract VideoHub
        shell: bash
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/.build"

          mkdir -p "$GITHUB_WORKSPACE/.build/project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/.build/project"

          echo ""
          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/.build/project" \
            -maxdepth 3 \
            -type f \
            | sort


      # ----------------------------------------
      # 8. Locate Gradle project
      # ----------------------------------------
      - name: Detect Gradle project
        shell: bash
        run: |
          set -eux

          SETTINGS_FILE=$(find \
            "$GITHUB_WORKSPACE/.build/project" \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Gradle project:"
          echo "$PROJECT_DIR"


      # ----------------------------------------
      # 9. Show project configuration
      # ----------------------------------------
      - name: Show Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "===== settings.gradle.kts ====="
          cat settings.gradle.kts

          echo ""
          echo "===== build.gradle.kts ====="
          cat build.gradle.kts

          echo ""
          echo "===== app/build.gradle.kts ====="
          cat app/build.gradle.kts

          echo ""
          echo "===== gradle-wrapper.properties ====="

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat gradle/wrapper/gradle-wrapper.properties
          else
            echo "No Gradle wrapper properties found."
          fi


      # ----------------------------------------
      # 10. Setup Gradle
      # ----------------------------------------
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'


      # ----------------------------------------
      # 11. Create Gradle properties
      # ----------------------------------------
      - name: Configure Gradle
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # ----------------------------------------
      # 12. Create debug keystore
      # ----------------------------------------
      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -eux

          if [ ! -f debug.keystore ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi


      # ----------------------------------------
      # 13. Check Java / Gradle / SDK
      # ----------------------------------------
      - name: Environment information
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          gradle --version

          echo ""
          echo "===== ANDROID SDK ====="
          sdkmanager --list_installed || true

          echo ""
          echo "===== SDK ROOT ====="
          echo "$ANDROID_HOME"


      # ----------------------------------------
      # 14. Run unit tests
      # ----------------------------------------
      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle test \
            --no-daemon \
            --stacktrace


      # ----------------------------------------
      # 15. Build Debug APK
      # ----------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ----------------------------------------
      # 16. Find APK
      # ----------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -eux

          echo "Searching for APK..."

          find "$GITHUB_WORKSPACE/.build/project" \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE=$(find \
            "$GITHUB_WORKSPACE/.build/project" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print \
            -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          echo "$APK_FILE"


      # ----------------------------------------
      # 17. Prepare release folder
      # ----------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/VideoHub-debug.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/release/VideoHub-debug.apk"


      # ----------------------------------------
      # 18. Upload APK
      # ----------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoHub-APK
          path: release/VideoHub-debug.apk
          if-no-files-found: error
          retention-days: 30
